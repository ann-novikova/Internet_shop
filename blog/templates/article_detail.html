{% extends 'base_blog.html' %}
{% block content %}
<div class="row col-4 mt-5">
    <h2>{{ object.title }}</h2>
    <p>Содержимое: {{ object.description }}</p>
    <p>Дата публикации: {{ object.created_at }}</p>
    <p>Количество просмотров: {{ object.views_count }}</p>
    <a href="{% url 'blog:article_update' object.pk %}" class="btn btn-warning">Изменить</a>
    <a href="{% url 'blog:article_delete' object.pk %}" class="btn btn-danger">Удалить</a>
    <a href="{% url 'blog:article_list' %}" class="btn btn-primary">Вернуться к списку</a>
</div>
{% endblock %}
