{% extends "base.html" %}
{% load my_tags %}

{% block title %}Редактировать профиль{% endblock %}

{% block content %}
<h2>Редактирование профиль</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
     {{ form.non_field_errors }}
    {{ form.as_p }}
    <button type="submit" class="p-2 btn btn-outline-primary">Сохранить</button>
    <a href="{% url 'catalog:home' %}" class="p-2 btn btn-outline-primary">Назад</a>
</form>
{% endblock %}
